services:
  db:
    image: postgres:15-alpine
    container_name: ekub_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ekub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: ekub_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ekub_db
      - SECRET_KEY=supersecretjwtkey_change_me_in_production_1234567890
    depends_on:
      - db

volumes:
  postgres_data:
